name: FOSS Check

on:
  push:
    paths-ignore:
      - "**/*.spdx"
      - "**/*.sbom.json"
      - "**/*.cdx.json"
      - "**/.ort/**"

jobs:
  scan:
    name: SBOM & Vulnerability Scan for Root
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install all dependencies with workspaces
        run: npm ci

      - name: Generate SBOM (CycloneDX JSON) for root
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom-root.cdx.json
          upload-artifact: false

      - name: Upload root-level SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: root-sbom-cyclonedx
          path: sbom-root.cdx.json

      - name: Scan SBOM for Vulnerabilities
        id: scan
        uses: anchore/scan-action@v4
        continue-on-error: true
        with:
          path: .
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: sarif

      - name: Upload Grype SARIF report
        uses: actions/upload-artifact@v4
        with:
          name: grype-sarif
          path: ${{ steps.scan.outputs.sarif }}

      - name: Upload SARIF to GitHub Code Scanning
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

  ort-check:
    name: ORT License & Policy Check
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies using npm workspaces
        run: npm ci

      - name: Clean caches
        run: rm -rf docs/.vite **/dist **/.cache

      - name: Run ORT
        uses: oss-review-toolkit/ort-ci-github-action@v1
        continue-on-error: true
        with:
          allow-dynamic-versions: "true"
          config: .ort.yml
          stacktrace: true

  scan-workspaces:
    name: SBOM Each Workspace
    runs-on: ubuntu-latest
    needs: ort-check
    strategy:
      matrix:
        project:
          - packages/aws-authenticator
          - packages/frontend-framework
          - packages/shared
          - apps/dev_project
          - docs
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Sanitize workspace name
        id: sanitize-name
        run: |
          sanitized_name=$(echo "${{ matrix.project }}" | sed 's|/|-|g')
          echo "SANITIZED_NAME=${sanitized_name}" >> $GITHUB_ENV

      - name: Generate SBOM
        working-directory: ${{ matrix.project }}
        run: |
          echo "Generating SBOM for workspace: ${{ matrix.project }}"
          npm sbom --sbom-format spdx > SBOM.spdx

      - name: Upload Workspace SBOM as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ env.SANITIZED_NAME }}
          path: ${{ matrix.project }}/SBOM.spdx

  commit-changes:
    name: Commit All SBOMs
    runs-on: ubuntu-latest
    needs: scan-workspaces
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download workspace SBOM artifacts only
        uses: actions/download-artifact@v4
        with:
          pattern: sbom-*
          path: ./sboms

      - name: Restore SBOM Files to Original Paths
        run: |
          for artifact in ./sboms/*; do
            sanitized_name=$(basename "$artifact")
            original_path=$(echo "$sanitized_name" | sed 's|^sbom-||; s|-|/|')
            mkdir -p "$original_path"
            mv "$artifact/SBOM.spdx" "$original_path/SBOM.spdx"
          done

      - name: Make Script Executable
        run: chmod +x ./scripts/unix/sbom_entries/add_fonts_to_sbom.sh

      - name: Add Google Fonts to SBOM
        run: ./scripts/unix/sbom_entries/add_fonts_to_sbom.sh

      - name: Set environment variables
        run: echo "GITHUB_ACTOR=${{ github.actor }}" >> $GITHUB_ENV

      - name: Set GitHub identity
        run: |
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git config --global user.name "${GITHUB_ACTOR}"

      - name: Pull latest changes to avoid conflicts
        run: git pull origin ${{ github.head_ref }}

      - name: Commit all SBOMs in one commit
        run: |
          git add .
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "chore(ci): add SBOMs for workspaces"
          git push

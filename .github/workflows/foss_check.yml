name: FOSS Check

on:
  push:
    paths-ignore:
      - '**/*.spdx'
      - '**/*.sbom.json'
      - '**/*.cdx.json'
      - '**/.ort/**'

jobs:
  scan:
    name: SBOM & Vulnerability Scan for Root
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install all dependencies with workspaces
        run: npm ci

      - name: Generate SBOM (CycloneDX JSON) for root
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom-root.cdx.json
          upload-artifact: false

      - name: Upload root-level SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: root-sbom-cyclonedx
          path: sbom-root.cdx.json
          if-no-files-found: error

      - name: Scan SBOM for Vulnerabilities (Anchore/Grype)
        id: scan
        uses: anchore/scan-action@v4
        continue-on-error: true
        with:
          path: .
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: sarif

      - name: Echo SARIF output path (debug)
        run: echo "sarif=${{ steps.scan.outputs.sarif }}"
        shell: bash

      - name: Upload Grype SARIF report (artifact)
        if: ${{ steps.scan.outputs.sarif != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: grype-sarif
          path: ${{ steps.scan.outputs.sarif }}
          if-no-files-found: ignore

      - name: Upload SARIF to GitHub Code Scanning
        if: ${{ steps.scan.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

  ort-check:
    name: ORT License & Policy Check
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies using npm workspaces
        run: npm ci

      - name: Run ORT
        id: ort
        uses: oss-review-toolkit/ort-ci-github-action@v1
        with:
          allow-dynamic-versions: 'true'
          ort-cli-args: '--config .ort/config.yml'

  scan-workspaces:
    name: SBOM Each Workspace
    runs-on: ubuntu-latest
    needs: ort-check
    strategy:
      matrix:
        project:
          - packages/aws-authenticator
          - packages/frontend-framework
          - packages/shared
          - apps/dev_project
          - docs
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Sanitize workspace name
        id: sanitize-name
        run: |
          sanitized_name=$(echo "${{ matrix.project }}" | sed 's|/|-|g')
          echo "SANITIZED_NAME=${sanitized_name}" >> $GITHUB_ENV

      - name: Generate SBOM
        working-directory: ${{ matrix.project }}
        run: |
          echo "Generating SBOM for workspace: ${{ matrix.project }}"
          npm sbom --sbom-format spdx --output SBOM.spdx >> SBOM.spdx
          test -f SBOM.spdx

      - name: Upload Workspace SBOM as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ env.SANITIZED_NAME }}
          path: ${{ matrix.project }}/SBOM.spdx
          if-no-files-found: error

  commit-changes:
    name: Commit All SBOMs
    runs-on: ubuntu-latest
    needs: scan-workspaces
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download workspace SBOM artifacts only
        uses: actions/download-artifact@v4
        with:
          pattern: sbom-*
          path: ./sboms

      - name: Debug artifact contents
        run: ls -R ./sboms

      - name: Restore SBOM Files to Original Paths
        run: |
          set -euo pipefail
          for artifact in ./sboms/*; do
            sanitized_name="$(basename "$artifact")"
            # strip "sbom-"
            original="${sanitized_name#sbom-}"
            # restore slashes (we replaced / by - when naming artifacts)
            # falls dein Repo-Pfad-Schema anders ist, hier anpassen
            original_path="$(echo "$original" | sed 's|-|/|')"
            echo "Restoring SBOM to: $original_path/SBOM.spdx"
            mkdir -p "$original_path"
            mv "$artifact/SBOM.spdx" "$original_path/SBOM.spdx"
          done

      - name: Make Script Executable
        run: chmod +x ./scripts/unix/sbom_entries/add_fonts_to_sbom.sh

      - name: Add Google Fonts to SBOM
        run: ./scripts/unix/sbom_entries/add_fonts_to_sbom.sh

      - name: Set GitHub identity
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Pull latest changes to avoid conflicts
        run: git pull --ff-only

      - name: Commit all SBOMs in one commit
        run: |
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit. Exiting."
            exit 0
          fi
          git commit -m "chore(ci): add SBOMs for workspaces"
          git push

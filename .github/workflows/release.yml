name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Start Dry Run'
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - 'SBOM.json'
      - '*.md'
      - '.github/**/*'
      - 'docs/**/*'

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Make scripts executable
        run: find ./scripts/unix/ -type f -exec chmod +x {} \;

      - name: Install dependencies
        run: npm i

      - name: Copy root README to frontend-framework package
        run: cp README.md packages/frontend-framework/README.md

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm run test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            packages/*/dist

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Make scripts executable
        run: find ./scripts/unix/ -type f -exec chmod +x {} \;

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .

      - name: Install dependencies
        run: npm i

      - name: Copy root README to frontend-framework package
        run: cp README.md packages/frontend-framework/README.md

      - name: Build all packages and release them
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm run release

      - name: Skip release (Dry Run mode)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        run: echo "Dry Run activated - Skipping Release"
